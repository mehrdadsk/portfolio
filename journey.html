const stage=document.getElementById('stage');const chapterEl=document.getElementById('chapters');
slides.forEach((s,i)=>{
 const el=document.createElement('section'); el.className='slide';el.setAttribute('aria-label',s.year+' '+s.title.replace(/<[^>]*>/g,''));el.innerHTML=`<div class="copy"><div class="chapter">${s.phase}</div><div class="year ${s.small?'small':''}">${s.year}</div><h2 class="lead">${s.title}</h2><p class="detail">${s.description}</p><div class="chipline">${s.chips.map(c=>'<span class="chip">'+c+'</span>').join('')}</div></div><div class="visual">${visuals[s.visual]}</div>`; stage.appendChild(el);
 const c=document.createElement('button');c.className='chapterdot';c.title=s.year+' — '+s.phase;c.setAttribute('aria-label','Jump to '+s.phase+' '+s.year);c.innerHTML='<span>'+s.year+'</span>';c.onclick=()=>seek(starts[i]);chapterEl.appendChild(c);
});
const els=[...stage.children],chs=[...chapterEl.children],starts=[];let cumulative=0;slides.forEach(s=>{starts.push(cumulative);cumulative+=s.time});const TOTAL=cumulative;
let t=0,playing=false,last=0,active=-1;const playBtn=document.getElementById('playBtn');const counter=document.getElementById('counter');const progress=document.getElementById('progress');const slider=document.getElementById('timebar');const veil=document.getElementById('endveil');
function fmt(x){let m=Math.floor(x/60),s=Math.floor(x%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function setSlide(i){if(i===active)return;els.forEach((el,j)=>{el.classList.toggle('active',j===i);el.setAttribute('aria-hidden',j!==i);});chs.forEach((c,j)=>{c.classList.toggle('active',j===i);c.classList.toggle('past',j<i);c.setAttribute('aria-current',j===i?'step':'false')});active=i}
function draw(){let i=slides.length-1;for(let j=0;j<slides.length;j++){if(t<starts[j]+slides[j].time){i=j;break}}setSlide(i);progress.style.width=(t/TOTAL*100)+'%';counter.textContent=fmt(t)+' / '+fmt(TOTAL);slider.setAttribute('aria-valuenow',String(Math.round(t)));}
function pause(){playing=false;playBtn.textContent='▶';playBtn.setAttribute('aria-label','Play presentation')}
function play(){if(t>=TOTAL){t=0;veil.classList.remove('show')}playing=true;last=performance.now();playBtn.textContent='Ⅱ';playBtn.setAttribute('aria-label','Pause presentation');requestAnimationFrame(tick)}
function tick(now){if(!playing)return; t=Math.min(TOTAL,t+(now-last)/1000);last=now;draw();if(t>=TOTAL){pause();veil.classList.add('show');return}requestAnimationFrame(tick)}
function seek(s){veil.classList.remove('show');t=Math.max(0,Math.min(TOTAL-.01,s));draw();if(playing)last=performance.now()}
function sceneIndex(){return Math.max(0,active)}
playBtn.onclick=()=>playing?pause():play();document.getElementById('backBtn').onclick=()=>seek(starts[Math.max(0,sceneIndex()-1)]);document.getElementById('nextBtn').onclick=()=>seek(starts[Math.min(slides.length-1,sceneIndex()+1)]);document.getElementById('replayBtn').onclick=()=>{seek(0);play()};slider.onclick=e=>{let r=slider.getBoundingClientRect();seek((e.clientX-r.left)/r.width*TOTAL)};slider.onkeydown=e=>{if(e.key==='ArrowRight'){seek(t+3);e.preventDefault()}if(e.key==='ArrowLeft'){seek(t-3);e.preventDefault()}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON'||e.target===slider)return;if(e.code==='Space'){playing?pause():play();e.preventDefault()}if(e.key==='ArrowLeft')seek(starts[Math.max(0,sceneIndex()-1)]);if(e.key==='ArrowRight')seek(starts[Math.min(slides.length-1,sceneIndex()+1)])});
draw();
// Explicit user-initiated option when motion reduction is enabled; otherwise auto-play while visible.
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){const observer=new IntersectionObserver(es=>{if(es[0].isIntersecting&&es[0].intersectionRatio>.35&&t===0&&!playing){play();observer.disconnect()}},{threshold:[0,.35,.8]});observer.observe(document.querySelector('.player'));}
