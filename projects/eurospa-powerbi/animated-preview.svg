<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="1060" height="520" role="img" aria-labelledby="title desc">
<title id="title">Animated treatment-line distribution on synthetic Danish registry data</title>
<desc id="desc">Three stacked bars repeatedly animate to show the TNFi, IL-17i and other treatment proportions for first-, second- and third-line treatments in synthetic Danish records. Not an original Power BI screenshot.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#172d3b"/><stop offset="1" stop-color="#0a111a"/></linearGradient></defs>
<rect width="1060" height="520" rx="24" fill="url(#bg)"/>
<rect x="34" y="30" width="992" height="460" rx="19" fill="#111d29" stroke="#385466" stroke-width="2"/>
<text x="52" y="73" fill="#4ed9c9" font-family="monospace" font-size="15" letter-spacing="3">EUROSPA  /  SYNTHETIC DATA  /  2026</text>
<text x="52" y="121" fill="#f3f8fc" font-family="Arial,sans-serif" font-size="31" font-weight="bold">Treatment class by treatment line</text>
<text x="52" y="152" fill="#a9bfcb" font-family="Arial,sans-serif" font-size="17">Demonstration: Danish synthetic registry (DK) · distribution within each treatment line</text>
<text x="52" y="219" font-family="Arial,sans-serif" font-size="20" fill="#e8f2fb">First-line treatments</text>
 <text x="247" y="189" font-family="Arial,sans-serif" font-size="14" fill="#9bb1c1">81  /  26  /  28 records · n=135</text>
 <rect x="247" y="198" width="602" height="29" rx="8" fill="#283845"/><rect x="247.00" y="198" width="0" height="29" fill="#28d6c5">
   <animate attributeName="width" values="0;361.20;361.20;0" keyTimes="0;0.23;0.88;1" dur="6s" repeatCount="indefinite" />
  </rect><rect x="608.20" y="198" width="0" height="29" fill="#7298ff">
   <animate attributeName="width" values="0;115.94;115.94;0" keyTimes="0;0.23;0.88;1" dur="6s" repeatCount="indefinite" />
  </rect><rect x="724.14" y="198" width="0" height="29" fill="#c2cbd4">
   <animate attributeName="width" values="0;124.86;124.86;0" keyTimes="0;0.23;0.88;1" dur="6s" repeatCount="indefinite" />
  </rect><text x="867" y="219" font-family="Arial,sans-serif" font-size="17" fill="#e8f2fb">60% TNFi</text><text x="52" y="310" font-family="Arial,sans-serif" font-size="20" fill="#e8f2fb">Second-line treatments</text>
 <text x="247" y="280" font-family="Arial,sans-serif" font-size="14" fill="#9bb1c1">18  /  10  /  13 records · n=41</text>
 <rect x="247" y="289" width="602" height="29" rx="8" fill="#283845"/><rect x="247.00" y="289" width="0" height="29" fill="#28d6c5">
   <animate attributeName="width" values="0;264.29;264.29;0" keyTimes="0;0.23;0.88;1" dur="6s" repeatCount="indefinite" />
  </rect><rect x="511.29" y="289" width="0" height="29" fill="#7298ff">
   <animate attributeName="width" values="0;146.83;146.83;0" keyTimes="0;0.23;0.88;1" dur="6s" repeatCount="indefinite" />
  </rect><rect x="658.12" y="289" width="0" height="29" fill="#c2cbd4">
   <animate attributeName="width" values="0;190.88;190.88;0" keyTimes="0;0.23;0.88;1" dur="6s" repeatCount="indefinite" />
  </rect><text x="867" y="310" font-family="Arial,sans-serif" font-size="17" fill="#e8f2fb">44% TNFi</text><text x="52" y="401" font-family="Arial,sans-serif" font-size="20" fill="#e8f2fb">Third-line treatments</text>
 <text x="247" y="371" font-family="Arial,sans-serif" font-size="14" fill="#9bb1c1">10  /  3  /  2 records · n=15</text>
 <rect x="247" y="380" width="602" height="29" rx="8" fill="#283845"/><rect x="247.00" y="380" width="0" height="29" fill="#28d6c5">
   <animate attributeName="width" values="0;401.33;401.33;0" keyTimes="0;0.23;0.88;1" dur="6s" repeatCount="indefinite" />
  </rect><rect x="648.33" y="380" width="0" height="29" fill="#7298ff">
   <animate attributeName="width" values="0;120.40;120.40;0" keyTimes="0;0.23;0.88;1" dur="6s" repeatCount="indefinite" />
  </rect><rect x="768.73" y="380" width="0" height="29" fill="#c2cbd4">
   <animate attributeName="width" values="0;80.27;80.27;0" keyTimes="0;0.23;0.88;1" dur="6s" repeatCount="indefinite" />
  </rect><text x="867" y="401" font-family="Arial,sans-serif" font-size="17" fill="#e8f2fb">67% TNFi</text>
<rect x="55" y="445" width="14" height="14" rx="3" fill="#28d6c5"/><text x="77" y="458" fill="#d7e7f0" font-size="15" font-family="Arial,sans-serif">TNFi</text>
<rect x="187" y="445" width="14" height="14" rx="3" fill="#7298ff"/><text x="209" y="458" fill="#d7e7f0" font-size="15" font-family="Arial,sans-serif">IL-17i</text>
<rect x="339" y="445" width="14" height="14" rx="3" fill="#c2cbd4"/><text x="361" y="458" fill="#d7e7f0" font-size="15" font-family="Arial,sans-serif">Other drug classes</text>
<text x="1000" y="458" text-anchor="end" fill="#7695a8" font-size="14" font-family="monospace">RECREATED VISUAL · NOT A PBIX EXPORT</text>
</svg>